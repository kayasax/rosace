<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6c63ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6c63ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="98" fill="url(#bg)" stroke="#6c63ff" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="85" fill="url(#glow)"/>

  <!-- Compass rose petals - 8 directions -->
  <!-- N -->
  <polygon points="100,20 93,72 100,60 107,72" fill="#a78bfa" opacity="0.9"/>
  <!-- S -->
  <polygon points="100,180 93,128 100,140 107,128" fill="#a78bfa" opacity="0.9"/>
  <!-- E -->
  <polygon points="180,100 128,93 140,100 128,107" fill="#7c3aed" opacity="0.9"/>
  <!-- W -->
  <polygon points="20,100 72,93 60,100 72,107" fill="#7c3aed" opacity="0.9"/>
  <!-- NE -->
  <polygon points="162,38 118,83 126,75 130,86" fill="#8b5cf6" opacity="0.7"/>
  <!-- SW -->
  <polygon points="38,162 82,117 74,125 86,130" fill="#8b5cf6" opacity="0.7"/>
  <!-- NW -->
  <polygon points="38,38 83,82 75,74 86,70" fill="#8b5cf6" opacity="0.7"/>
  <!-- SE -->
  <polygon points="162,162 117,118 125,126 70,86" fill="#8b5cf6" opacity="0.7"/>

  <!-- Center circle -->
  <circle cx="100" cy="100" r="18" fill="#1a1a2e" stroke="#6c63ff" stroke-width="2"/>
  <circle cx="100" cy="100" r="8" fill="#a78bfa"/>

  <!-- Email envelope shape in center -->
  <rect x="87" y="94" width="26" height="18" rx="2" fill="none" stroke="#ede9fe" stroke-width="1.5" opacity="0.9"/>
  <polyline points="87,94 100,105 113,94" fill="none" stroke="#ede9fe" stroke-width="1.5" opacity="0.9"/>

  <!-- Outer ring dots at cardinal points -->
  <circle cx="100" cy="16" r="2.5" fill="#a78bfa"/>
  <circle cx="100" cy="184" r="2.5" fill="#a78bfa"/>
  <circle cx="16" cy="100" r="2.5" fill="#a78bfa"/>
  <circle cx="184" cy="100" r="2.5" fill="#a78bfa"/>
</svg>
